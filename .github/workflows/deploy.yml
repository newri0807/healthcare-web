name: Deploy React
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: SSH Remote Commands
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_NAME }}
        key: ${{ secrets.SERVER_ACCESS_KEY }}
        script: |
          set -e
          echo "🚀 React (Vite) '클린' 배포 시작..."
          
          # 1. 무조건 강제 삭제 (에러 방지 || true 추가)
          sudo rm -rf /home/ubuntu/web-deploys/healthcare/repo-healthcare || true
          
          # 2. 메인 브랜치 강제 다운로드
          cd /home/ubuntu/web-deploys/healthcare
          git clone -b main https://github.com/newri0807/healthcare-web.git repo-healthcare
          
          # 3. 도커 실행 위치로 이동
          cd /home/ubuntu/web-deploys/healthcare
          
          # 4. 도커 실행
          # 저우선순위 builder로 빌드 (서비스에 CPU 양보, 코어 1~3, 메모리 4GB)
          docker buildx inspect lowprio >/dev/null 2>&1 || docker buildx create --name lowprio --driver docker-container --driver-opt cpu-shares=256 --driver-opt cpuset-cpus=1-3 --driver-opt memory=4g --driver-opt default-load=true --bootstrap
          docker compose build --builder lowprio healthcare-web
          docker compose up -d healthcare-web
          docker image prune -f
          
          echo "✅ React 배포 완료!"
